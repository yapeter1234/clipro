name: Validate timeline contract

on:
  push:
    paths:
      - "packages/timeline/**"
      - "services/api/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-timeline.yml"
  pull_request:
    paths:
      - "packages/timeline/**"
      - "tests/test_timeline_schema.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-timeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jsonschema pytest httpx

      - name: Validate timeline schema and example
        run: python -m pytest -q tests
