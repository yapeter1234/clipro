name: Validate timeline contract and web app

on:
  push:
    paths:
      - "packages/timeline/**"
      - "services/api/**"
      - "services/worker/**"
      - "config/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "apps/web/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-timeline.yml"
  pull_request:
    paths:
      - "packages/timeline/**"
      - "services/api/**"
      - "services/worker/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "apps/web/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-timeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r services/api/requirements.txt -r services/worker/requirements.txt

      - name: Validate timeline schema and API tests
        run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_CLIPRO_API_URL: https://api.example.test
